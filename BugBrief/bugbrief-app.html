<html lang="en"><head>
<script>
/* AI Setup add-on: lets this app get live AI answers when opened as a normal file.
   Inside Claude's viewer window.claude already exists, so this file does nothing there.
   Keys are saved only in THIS browser (localStorage) and are sent only to the provider you pick. */
(function () {
  if (window.claude && window.claude.use) return;

  var STORE = 'ai_setup_v1';
  var DEF = {
    provider: 'groq',
    groq_key: '', groq_model: 'llama-3.3-70b-versatile',
    xai_key: '', xai_model: 'grok-4',
    gemini_key: '', gemini_model: 'gemini-3.1-flash-lite',
    anthropic_key: '', anthropic_model: 'claude-sonnet-5-5', anthropic_quick: 'claude-haiku-5-5',
    ollama_url: 'http://localhost:11434', ollama_model: 'llama3.2'
  };
  var BASE = { groq: 'https://api.groq.com/openai/v1', xai: 'https://api.x.ai/v1' };
  function load() {
    var o = {}; try { o = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
    var c = {}; for (var k in DEF) c[k] = (o[k] !== undefined && o[k] !== '') ? o[k] : DEF[k];
    return c;
  }
  function save(c) { try { localStorage.setItem(STORE, JSON.stringify(c)); } catch (e) {} }
  var cfg = load();

  function configured(c) {
    if (c.provider === 'groq') return !!c.groq_key.trim();
    if (c.provider === 'xai') return !!c.xai_key.trim();
    if (c.provider === 'gemini') return !!c.gemini_key.trim();
    if (c.provider === 'anthropic') return !!c.anthropic_key.trim();
    return !!c.ollama_url.trim();
  }
  function err(msg, code) { var e = new Error(msg); e.code = code || 'user'; e.message = msg; return e; }

  function fileToB64(f) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { res(String(r.result).split(',')[1]); };
      r.onerror = function () { rej(err('Could not read the screenshot.')); };
      r.readAsDataURL(f);
    });
  }
  async function readJSON(r) { try { return await r.json(); } catch (e) { return {}; } }

  /* ---------- providers ---------- */
  async function callAnthropic(c, prompt, o) {
    var content = [];
    var imgs = o.images || [];
    for (var i = 0; i < imgs.length; i++) content.push({ type: 'image', source: { type: 'base64', media_type: imgs[i].type || 'image/png', data: await fileToB64(imgs[i]) } });
    content.push({ type: 'text', text: prompt });
    var model = o.modelTier === 'quick' ? c.anthropic_quick : c.anthropic_model;
    var r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST', signal: o.signal,
      headers: { 'content-type': 'application/json', 'x-api-key': c.anthropic_key.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model, max_tokens: 4096, messages: [{ role: 'user', content: content }] })
    });
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && j.error.message) || ('HTTP ' + r.status);
      if (r.status === 401) throw err('Your Anthropic key was rejected. Open AI Setup and paste the key again.');
      if (r.status === 429) throw err('Anthropic says too many requests. Wait a minute and try again.', 'rate_limited');
      if (r.status === 400 && /credit/i.test(m)) throw err('Your Anthropic account has no credit. Add a few dollars at console.anthropic.com/settings/billing, or switch to a free provider in AI Setup.');
      throw err('Anthropic error: ' + m);
    }
    var text = (j.content || []).map(function (b) { return b.text || ''; }).join('');
    return { text: text, truncated: j.stop_reason === 'max_tokens' };
  }

  async function geminiPickModel(c, signal) {
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200', { signal: signal, headers: { 'x-goog-api-key': c.gemini_key.trim() } });
    var j = await readJSON(r); var list = (j.models || []).filter(function (m) {
      return /flash/.test(m.name) && !/image|tts|live|audio|robotics|computer|embedding|exp/.test(m.name) && (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0;
    }).map(function (m) { return m.name.replace('models/', ''); });
    list.sort(function (a, b) { return (/preview/.test(a) ? 1 : 0) - (/preview/.test(b) ? 1 : 0); });
    return list[0] || null;
  }
  async function callGemini(c, prompt, o, retried) {
    var parts = [];
    var imgs = o.images || [];
    for (var i = 0; i < imgs.length; i++) parts.push({ inline_data: { mime_type: imgs[i].type || 'image/png', data: await fileToB64(imgs[i]) } });
    parts.push({ text: prompt });
    var r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(c.gemini_model) + ':generateContent', {
      method: 'POST', signal: o.signal,
      headers: { 'content-type': 'application/json', 'x-goog-api-key': c.gemini_key.trim() },
      body: JSON.stringify({ contents: [{ role: 'user', parts: parts }], generationConfig: { maxOutputTokens: 8192 } })
    });
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && j.error.message) || ('HTTP ' + r.status);
      if (r.status === 404 && !retried) {
        var alt = await geminiPickModel(c, o.signal);
        if (alt && alt !== c.gemini_model) { c.gemini_model = alt; cfg.gemini_model = alt; save(cfg); return callGemini(c, prompt, o, true); }
      }
      if (r.status === 400 && /API key/i.test(m)) throw err('Your Gemini key looks wrong. Open AI Setup and paste it again (it starts with AIza).');
      if (r.status === 403) throw err('Google refused this key (' + m + '). Create a fresh key at aistudio.google.com/apikey and paste it in AI Setup.');
      if (r.status === 429) throw err('Free limit reached for now. Wait a minute and try again.', 'rate_limited');
      throw err('Gemini error: ' + m);
    }
    var cand = (j.candidates || [])[0] || {};
    var text = ((cand.content || {}).parts || []).map(function (p) { return p.text || ''; }).join('');
    if (!text && j.promptFeedback && j.promptFeedback.blockReason) throw err('Gemini blocked this request (' + j.promptFeedback.blockReason + ').');
    return { text: text, truncated: cand.finishReason === 'MAX_TOKENS' };
  }

  async function openaiPickModel(c, which, signal) {
    var r = await fetch(BASE[which] + '/models', { signal: signal, headers: { Authorization: 'Bearer ' + c[which + '_key'].trim() } });
    var j = await readJSON(r), ids = (j.data || []).map(function (m) { return m.id; });
    var pref = which === 'groq'
      ? ['llama-3.3-70b-versatile', 'llama-3.1-8b-instant', 'openai/gpt-oss-120b', 'openai/gpt-oss-20b']
      : [];
    for (var i = 0; i < pref.length; i++) if (ids.indexOf(pref[i]) >= 0) return pref[i];
    ids = ids.filter(function (x) { return which === 'xai' ? /grok/.test(x) && !/image|imagine|video/.test(x) : !/whisper|tts|guard|embed|orpheus/.test(x); });
    return ids[0] || null;
  }
  async function callOpenAI(c, which, prompt, o, retried) {
    var content = prompt, imgs = o.images || [];
    if (imgs.length && which === 'xai') {
      content = [];
      for (var i = 0; i < imgs.length; i++) content.push({ type: 'image_url', image_url: { url: 'data:' + (imgs[i].type || 'image/png') + ';base64,' + await fileToB64(imgs[i]) } });
      content.push({ type: 'text', text: prompt });
    }
    var model = c[which + '_model'], name = which === 'groq' ? 'Groq' : 'Grok (xAI)';
    var r;
    try {
      r = await fetch(BASE[which] + '/chat/completions', {
        method: 'POST', signal: o.signal,
        headers: { 'content-type': 'application/json', Authorization: 'Bearer ' + c[which + '_key'].trim() },
        body: JSON.stringify({ model: model, max_tokens: 4096, messages: [{ role: 'user', content: content }] })
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw err('Could not reach ' + name + '. Check your internet. If it still fails, your browser is blocking direct calls (CORS): use the Python version of the app (start.bat) or choose Ollama.');
    }
    var j = await readJSON(r);
    if (!r.ok) {
      var m = (j.error && (j.error.message || j.error)) || ('HTTP ' + r.status);
      if ((r.status === 404 || (r.status === 400 && /model/i.test(String(m)))) && !retried) {
        var alt = await openaiPickModel(c, which, o.signal);
        if (alt && alt !== model) { c[which + '_model'] = alt; cfg[which + '_model'] = alt; save(cfg); return callOpenAI(c, which, prompt, o, true); }
      }
      if (r.status === 401) throw err('Your ' + name + ' key was rejected. Open AI Setup and paste it again' + (which === 'groq' ? ' (Groq keys start with gsk_).' : ' (xAI keys start with xai-).'));
      if (r.status === 402 || (r.status === 403 && which === 'xai')) throw err('xAI says this key has no credit. Grok is paid, so add credit at console.x.ai, or switch to Groq (free) in AI Setup.');
      if (r.status === 429) throw err(name + ' says too many requests or the free limit is used up. Wait a minute and try again.', 'rate_limited');
      if (r.status === 413) throw err('That was too much text for ' + name + ' free limits. Try shorter input.');
      throw err(name + ' error: ' + m);
    }
    var ch = (j.choices || [])[0] || {};
    return { text: (ch.message && ch.message.content) || '', truncated: ch.finish_reason === 'length' };
  }

  async function callOllama(c, prompt, o) {
    var r;
    try {
      r = await fetch(c.ollama_url.replace(/\/$/, '') + '/api/chat', {
        method: 'POST', signal: o.signal, headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ model: c.ollama_model, stream: false, messages: [{ role: 'user', content: prompt }] })
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw e;
      throw err('Cannot reach Ollama. Make sure Ollama is running, and that you started it with the setting OLLAMA_ORIGINS=* (see AI Setup for the one-line command). Easier: use a free Gemini key instead.');
    }
    var j = await readJSON(r);
    if (!r.ok) {
      if (r.status === 404) throw err('Ollama does not have the model "' + c.ollama_model + '". Run:  ollama pull ' + c.ollama_model);
      if (r.status === 403) throw err('Ollama blocked this page. Restart Ollama with OLLAMA_ORIGINS=* (see AI Setup).');
      throw err('Ollama error: ' + ((j && j.error) || r.status));
    }
    return { text: (j.message && j.message.content) || '', truncated: false };
  }

  async function run(prompt, o) {
    o = o || {};
    var c = cfg, res;
    if (c.provider === 'groq' || c.provider === 'xai') res = await callOpenAI(Object.assign({}, c), c.provider, prompt, o);
    else if (c.provider === 'gemini') res = await callGemini(Object.assign({}, c), prompt, o);
    else if (c.provider === 'anthropic') res = await callAnthropic(c, prompt, o);
    else res = await callOllama(c, prompt, o);
    if (o.onText) { try { o.onText({ text: res.text }); } catch (e) {} }
    return res;
  }

  function extractJSON(t) {
    t = String(t || '').replace(/```json|```/g, '').trim();
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if (a < 0 || b <= a) return null;
    try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { return null; }
  }

  function makeSample() {
    var f = function (prompt, o) { return run(prompt, o); };
    f.json = async function (prompt, o) {
      var r = await run(prompt, o), obj = extractJSON(r.text);
      if (!obj) { r = await run(prompt + '\n\nReply with ONLY the JSON object. No markdown fences, no commentary.', o); obj = extractJSON(r.text); }
      if (!obj) throw { code: 'invalid_json', message: 'The AI reply could not be read as data.' };
      return obj;
    };
    f.limits = async function () {
      if (cfg.provider === 'ollama' || cfg.provider === 'groq') return {};
      return { images: { maxCount: 4, mediaTypes: ['image/png', 'image/jpeg', 'image/webp', 'image/gif'], maxInputBytes: 4000000 } };
    };
    return f;
  }

  var downloads = {
    save: async function (o) {
      var b = new Blob([o.data], { type: 'text/plain;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b); a.download = o.filename || 'export.txt';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    }
  };

  window.claude = {
    isShim: true,
    use: async function (name) {
      if (name === 'sample') return configured(cfg) ? makeSample() : null;
      if (name === 'downloads') return downloads;
      return null;
    }
  };

  /* ---------- AI Setup button + panel ---------- */
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function ui() {
    var css = document.createElement('style');
    css.textContent =
      '#aisBtn{position:fixed;right:14px;bottom:14px;z-index:2147483000;border:0;border-radius:999px;padding:10px 16px;font:600 14px system-ui,sans-serif;color:#fff;background:#4f46e5;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}' +
      '#aisBtn.ok{background:#059669}' +
      '#aisBox{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:14px}' +
      '#aisBox.on{display:flex}' +
      '#aisCard{background:#fff;color:#111;width:100%;max-width:470px;max-height:92vh;overflow:auto;border-radius:14px;padding:18px;font:14px/1.45 system-ui,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.4)}' +
      '#aisCard h3{margin:0 0 4px;font-size:18px}#aisCard p{margin:6px 0}#aisCard label{display:block;margin:10px 0 3px;font-weight:600}' +
      '#aisCard input,#aisCard select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #bbb;border-radius:8px;font:14px system-ui,sans-serif;background:#fff;color:#111}' +
      '#aisCard .row{display:flex;gap:8px;margin-top:14px}#aisCard button{flex:1;padding:10px;border:0;border-radius:8px;font:600 14px system-ui,sans-serif;cursor:pointer}' +
      '#aisCard .pri{background:#4f46e5;color:#fff}#aisCard .sec{background:#e5e7eb;color:#111}' +
      '#aisCard .hint{font-size:12.5px;color:#444;background:#f3f4f6;border-radius:8px;padding:8px;margin-top:6px}' +
      '#aisCard code{background:#e5e7eb;padding:1px 4px;border-radius:4px;font-size:12.5px;word-break:break-all}' +
      '#aisMsg{margin-top:8px;font-weight:600}';
    document.head.appendChild(css);
    var btn = document.createElement('button'); btn.id = 'aisBtn'; btn.type = 'button';
    var box = document.createElement('div'); box.id = 'aisBox';
    document.body.appendChild(btn); document.body.appendChild(box);

    function label() {
      var ok = configured(cfg);
      btn.className = ok ? 'ok' : '';
      btn.textContent = ok ? 'AI: ' + ({ groq: 'Groq', xai: 'Grok', gemini: 'Gemini', anthropic: 'Claude', ollama: 'Ollama' })[cfg.provider] + ' \u2713' : '\u2699 AI Setup (tap to turn on AI)';
    }
    function fields() {
      var p = document.getElementById('aisProv').value, h = '';
      if (p === 'groq') h = '<label>Groq key (free)</label><input id="aisQK" type="password" autocomplete="off" placeholder="gsk_..." value="' + esc(cfg.groq_key) + '">' +
        '<div class="hint"><b>Free, no card:</b> open <code>console.groq.com/keys</code>, sign in, tap <b>Create API Key</b>, copy it, paste above.</div>' +
        '<label>Model (leave as is)</label><input id="aisQM" value="' + esc(cfg.groq_model) + '">';
      else if (p === 'xai') h = '<label>Grok (xAI) key</label><input id="aisXK" type="password" autocomplete="off" placeholder="xai-..." value="' + esc(cfg.xai_key) + '">' +
        '<div class="hint">Get it at <code>console.x.ai</code>. The Grok API is <b>paid</b> (needs credit). For a free option choose Groq above.</div>' +
        '<label>Model (leave as is)</label><input id="aisXM" value="' + esc(cfg.xai_model) + '">';
      else h = '<label>Ollama address</label><input id="aisOU" value="' + esc(cfg.ollama_url) + '"><label>Model</label><input id="aisOM" value="' + esc(cfg.ollama_model) + '">' +
        '<div class="hint">No key needed. Ollama must be running and allowed to talk to web pages. Windows (PowerShell): <code>setx OLLAMA_ORIGINS "*"</code> then restart Ollama. Mac/Linux: <code>OLLAMA_ORIGINS=* ollama serve</code>. Then run <code>ollama pull llama3.2</code> once.</div>';
      document.getElementById('aisF').innerHTML = h;
    }
    function open() {
      box.innerHTML = '<div id="aisCard"><h3>AI Setup</h3><p>Pick where the AI answers come from. Everything is saved only in this browser.</p>' +
        '<label>AI provider</label><select id="aisProv"><option value="groq">Groq - free key (recommended)</option><option value="xai">Grok (xAI) - paid key</option><option value="ollama">Ollama - no key, runs on this computer</option></select>' +
        '<div id="aisF"></div><div id="aisMsg"></div>' +
        '<div class="row"><button class="sec" id="aisX" type="button">Close</button><button class="sec" id="aisT" type="button">Test</button><button class="pri" id="aisS" type="button">Save</button></div></div>';
      box.className = 'on';
      var sel = document.getElementById('aisProv'); if (['groq','xai','ollama'].indexOf(cfg.provider) < 0) cfg.provider = 'groq'; sel.value = cfg.provider; fields();
      sel.onchange = function () { cfg.provider = sel.value; fields(); };
      function read() {
        var n = Object.assign({}, cfg); n.provider = sel.value;
        var g = function (id) { var e = document.getElementById(id); return e ? e.value.trim() : null; };
        if (g('aisQK') !== null) n.groq_key = g('aisQK'); if (g('aisQM')) n.groq_model = g('aisQM');
        if (g('aisXK') !== null) n.xai_key = g('aisXK'); if (g('aisXM')) n.xai_model = g('aisXM');
        if (g('aisOU')) n.ollama_url = g('aisOU'); if (g('aisOM')) n.ollama_model = g('aisOM');
        return n;
      }
      document.getElementById('aisX').onclick = function () { box.className = ''; };
      document.getElementById('aisS').onclick = function () { cfg = read(); save(cfg); location.reload(); };
      document.getElementById('aisT').onclick = async function () {
        var m = document.getElementById('aisMsg'); var keep = cfg; cfg = read();
        m.style.color = '#444'; m.textContent = 'Testing...';
        try { var r = await run('Reply with exactly: AI connection OK', { modelTier: 'quick' }); m.style.color = '#059669'; m.textContent = 'Works: ' + String(r.text).slice(0, 60); }
        catch (e) { m.style.color = '#b91c1c'; m.textContent = (e && e.message) || 'Test failed.'; }
        cfg = keep;
      };
    }
    btn.onclick = open; label();
    if (!configured(cfg)) { try { if (!sessionStorage.getItem('ais_shown')) { sessionStorage.setItem('ais_shown', '1'); setTimeout(open, 600); } } catch (e) {} }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ui); else ui();
})();

</script>

<style>
:root{--bg:#F5F1E8;--surface:#FFFFFF;--surface2:#EFE9DB;--ink:#1E2B28;--muted:#617069;--line:#DDD5C3;--accent:#E4572E;--accent-ink:#fff;--teal:#12796B;
--crit:#C62828;--high:#E4572E;--med:#B7860B;--low:#12796B;--code-bg:#1E2B28;--code-ink:#EAF1ED;--shadow:rgba(30,43,40,.16);
--sans:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--surface:#18221F;--surface2:#212E2A;--ink:#EEF3F0;--muted:#9DAEA6;--line:#2C3B36;--accent:#FF7A57;--accent-ink:#1A0F0B;--teal:#3FD0B8;
--crit:#FF6B6B;--high:#FF8A63;--med:#E8B93C;--low:#3FD0B8;--code-bg:#0B100E;--code-ink:#EAF1ED;--shadow:rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101715;--surface:#18221F;--surface2:#212E2A;--ink:#EEF3F0;--muted:#9DAEA6;--line:#2C3B36;--accent:#FF7A57;--accent-ink:#1A0F0B;--teal:#3FD0B8;
--crit:#FF6B6B;--high:#FF8A63;--med:#E8B93C;--low:#3FD0B8;--code-bg:#0B100E;--code-ink:#EAF1ED;--shadow:rgba(0,0,0,.5);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}html,body{height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
#app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.02em}
.mark{width:28px;height:28px;border-radius:9px;background:var(--accent);position:relative;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.mark::before,.mark::after{content:"";position:absolute;top:8px;width:5px;height:5px;border-radius:50%;background:var(--accent-ink)}.mark::before{left:7px}.mark::after{right:7px}

    evalCard('Log parsing', o.parts.parser) + evalCard('Privacy redaction', o.parts.redaction) + evalCard('Severity rules', o.parts.severity, ' · within one level ' + pct(o.parts.severity.withinOne) + '%') + evalCard('Duplicate finder', o.parts.dedupe, ' · precision ' + pct(o.parts.dedupe.precision) + '%, recall ' + pct(o.parts.dedupe.recall) + '%') + evalCard('Templates', o.parts.templates); }
  h += '</div><div class="card"><h3>Live check with Claude</h3><p class="sub">Writes reports for 3 labelled bugs, then checks severity, key facts and fabricated log quotes. Uses 3 Claude calls (text only).</p><div class="row"><button class="btn" data-act="run-live"' + (busy || S.claude === 'off' ? ' disabled' : '') + '>' + (busy === 'live' ? 'Running…' : 'Run live check') + '</button>' + (busy === 'live' ? '<button class="btn danger" data-act="eval-stop">Stop</button>' : '') + '</div>';
  if (E.live) { var L = E.live; h += '<div class="metrics"><div class="metric"><b>' + pct(L.sevExact / L.n) + '%</b><span>severity exact</span></div><div class="metric"><b>' + pct(L.kw) + '%</b><span>key facts found</span></div><div class="metric"><b>' + L.fab + '</b><span>fake quotes</span></div></div>' +
    L.rows.map(function (r) { return '<div class="evrow"><div><b>' + esc(r.id) + '</b><em>severity ' + esc(r.sev) + ' (expected ' + esc(r.expSev) + ') · facts ' + pct(r.kw) + '% · repro ' + r.score + '</em></div><span class="evb ' + (r.sev === r.expSev ? 'ok' : 'mid') + '">' + (r.sev === r.expSev ? 'match' : 'differs') + '</span></div>'; }).join(''); }
  h += '</div><div class="card"><h3>Self-tests</h3><p class="sub">Unit tests for redaction, parsing, schema repair, grounding, scoring and export, run live in your browser.</p><div class="row"><button class="btn" data-act="run-tests"' + (busy ? ' disabled' : '') + '>Run self-tests</button>' + (E.offline || E.live || E.tests ? '<button class="btn" data-act="exp-eval">Export results</button>' : '') + '</div>';
  if (E.tests) { var okN = E.tests.filter(function (t) { return t.ok; }).length; h += '<div class="tsum ' + (okN === E.tests.length ? 'ok' : 'bad') + '">' + okN + ' of ' + E.tests.length + ' passed</div>' + E.tests.map(function (t) { return '<div class="trow2 ' + (t.ok ? 'ok' : 'bad') + '"><span>' + (t.ok ? '✓' : '✗') + '</span><span>' + esc(t.name) + (t.ok ? '' : '<em>' + esc(t.detail) + '</em>') + '</span></div>'; }).join(''); }
  v.innerHTML = h + '</div>';
}
async function runLive() {
  if (S.eval.running) return; S.eval.running = 'live'; S.ctl = new AbortController(); S.eval.live = null; renderEval();
  var rows = [], fab = 0, kw = 0, exact = 0;
  try {
    for (var i = 0; i < GOLDEN.reports.length; i++) {
      var c = GOLDEN.reports[i], res = await draftReport({ desc: c.inputs.description, logs: c.inputs.logs, env: { app: '', version: '', os: '', device: '', browser: '' }, shots: [] }, { signal: S.ctl.signal });
      if (res.offline) throw { code: 'unavailable', message: 'Claude is not answering in this view.' };
      var r = res.report, hay = [r.title, r.summary, r.steps.map(function (s) { return s.text; }).join(' '), r.expected, r.actual, r.component].join(' ').toLowerCase();
      var found = c.expected.keywords.filter(function (k) { return hay.indexOf(k) >= 0; }).length / c.expected.keywords.length;
      rows.push({ id: c.id, sev: r.severity, expSev: c.expected.severity, kw: found, score: res.score }); fab += res.grounding.fabricatedQuotes; kw += found; if (r.severity === c.expected.severity) exact++;

  S.eval.running = ''; S.ctl = null; renderEval();
}

/* ---------- export ---------- */
async function saveFile(name, data) {
  try {
    var dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: data }); toast('Saved ' + name); return; }
  } catch (e) { if (e && e.code === 'declined') { toast('Download cancelled.'); return; } if (e && e.code === 'rate_limited') { toast('Another save is pending. Try again shortly.'); return; } }
  try { await navigator.clipboard.writeText(data); toast('Downloads are unavailable here, so it was copied to your clipboard.'); } catch (e) { openSheet('Copy export', '<textarea class="exp" readonly>' + esc(data) + '</textarea>'); }
}
function copyText(t) { if (navigator.clipboard) navigator.clipboard.writeText(t).then(function () { toast('Copied.'); }, function () { openSheet('Copy', '<textarea class="exp" readonly>' + esc(t) + '</textarea>'); }); else openSheet('Copy', '<textarea class="exp" readonly>' + esc(t) + '</textarea>'); }
function slug(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'bug-report'; }

/* ---------- edit sheet ---------- */
function editSheet() {
  var r = S.cur.report;
  openSheet('Edit report', '<div class="form"><label class="mini"><span>Title</span><input id="e-title" type="text" maxlength="140" value="' + esc(r.title) + '"></label><label class="mini"><span>Severity</span><select id="e-sev">' + Core.SEV.map(function (s) { return '<option' + (s === r.severity ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></label>' +
    '<label class="mini"><span>Component</span><input id="e-comp" type="text" maxlength="60" value="' + esc(r.component) + '"></label><label class="mini"><span>Expected</span><textarea id="e-exp" rows="2">' + esc(r.expected) + '</textarea></label><label class="mini"><span>Actual</span><textarea id="e-act" rows="2">' + esc(r.actual) + '</textarea></label>' +
    '<button class="btn primary" data-act="save-edit">Save changes</button></div>');
}
function saveEdit() {
  var r = S.cur.report; r.title = $('#e-title').value.trim().slice(0, 140) || r.title; r.severity = $('#e-sev').value; r.component = $('#e-comp').value.trim().slice(0, 60); r.expected = $('#e-exp').value.trim().slice(0, 500); r.actual = $('#e-act').value.trim().slice(0, 500);

function settingsSheet() {
  var s = S.settings;
  openSheet('Settings', '<div class="setrow"><b>Default template</b><div class="chips">' + Object.keys(STYLES).map(function (k) { return '<button class="chip' + (s.style === k ? ' on' : '') + '" data-act="set-style" data-s="' + k + '">' + STYLES[k][0] + '</button>'; }).join('') + '</div></div>' +
    '<div class="setrow"><div><b>Strict privacy</b><em>Also hide IP addresses, phone numbers, home folder names and cookies.</em></div><button class="switch' + (s.strict ? ' on' : '') + '" data-act="toggle" data-k="strict" role="switch" aria-checked="' + !!s.strict + '"><i></i></button></div>' +
    '<div class="setrow"><div><b>Include suspected cause</b><em>Adds a clearly labelled hypothesis when the evidence supports one.</em></div><button class="switch' + (s.cause ? ' on' : '') + '" data-act="toggle" data-k="cause" role="switch" aria-checked="' + !!s.cause + '"><i></i></button></div>' +
    '<div class="setrow"><div><b>Claude status</b><em>' + (S.claude === 'ready' ? 'Connected' + (S.caps ? ', screenshots enabled.' : ', screenshots unavailable.') : S.claude === 'off' ? 'Unavailable here. Offline drafts only.' : 'Checking…') + '</em></div></div>' +
    (S.storageWarn ? '<div class="note warn">Browser storage is blocked, so history lasts only until you close this page.</div>' : '') + '<div class="row"><button class="btn danger" data-act="clear-history">Delete all reports</button></div>');

/* ---------- render + events ---------- */
function render() {
  renderHeader(); renderTabs();
  $$('.view').forEach(function (v) { v.hidden = v.id !== 'view-' + S.tab; });

    case 'open': var h = S.history.find(function (x) { return x.id === d.id; }); if (h) { S.cur = h; S.stage = 'result'; S.tab = 'create'; S.inputs.desc = h.inputs.desc; S.inputs.logs = h.inputs.logs; render(); $('#main').scrollTop = 0; } break;
    case 'del': S.history = S.history.filter(function (x) { return x.id !== d.id; }); persistHistory(); renderReports(); break;
    case 'sevf': S.sevFilter = d.s; renderReports(); break;

    case 'exp-csv': saveFile('bugbrief-reports.csv', Core.toCsv(S.history)); break;

  }
});

render(); getSample();
